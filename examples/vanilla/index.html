<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MachTable · Vanilla Demo</title>
    <style>
      * { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f1f5f9;
        padding: 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .toolbar input[type="text"] {
        height: 30px;
        padding: 0 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        outline: none;
        min-width: 200px;
      }
      .toolbar select {
        height: 30px;
        padding: 0 6px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        outline: none;
      }
      .toolbar button {
        height: 30px;
        padding: 0 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      .toolbar button:hover { border-color: #2563eb; color: #2563eb; }
      #gridHost {
        height: 52vh;
        min-height: 360px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      }
      #schemaHost {
        height: 42vh;
        min-height: 320px;
        margin-top: 14px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      }
      .section-title {
        margin: 14px 0 8px;
        font-size: 13px;
        font-weight: 600;
        color: #334155;
      }
      #log {
        margin-top: 8px;
        height: 56px;
        overflow: auto;
        font-size: 12px;
        color: #64748b;
        background: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        border: 1px solid #e2e8f0;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 18px;
      }
      .badge-active { background: #dcfce7; color: #15803d; }
      .badge-idle { background: #f1f5f9; color: #64748b; }
      .badge-error { background: #fee2e2; color: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <input id="quickFilter" type="text" placeholder="快速过滤（回车应用）..." />
      <select id="sizeSel" title="密度">
        <option value="compact">紧凑密度</option>
        <option value="normal">标准密度</option>
        <option value="large">宽松密度</option>
      </select>
      <label style="font-size:13px;color:#475569;display:inline-flex;align-items:center;gap:4px;">
        <input type="checkbox" id="stripedChk" checked /> 斑马纹
      </label>
      <label style="font-size:13px;color:#475569;display:inline-flex;align-items:center;gap:4px;">
        <input type="checkbox" id="bordersChk" /> 网格线
      </label>
      <button id="btnCsv">导出 CSV</button>
      <button id="btnAutoSize">列宽自适应</button>
      <button id="btnReset">重置列状态</button>
      <button id="btnSelectAll">全选</button>
      <button id="btnClearSort">清除排序</button>
      <button id="btnTheme">深色模式</button>
      <span id="info" style="color:#64748b;font-size:13px;"></span>
    </div>
    <div id="gridHost"></div>
    <div class="section-title">Schema 驱动渲染 + 多级表头 + 主从明细（点 ▶ 展开嵌套子表格）· 支持框选复制（Ctrl+C/X/V、Delete、右键菜单、填充柄）</div>
    <div id="schemaHost"></div>
    <div class="section-title">无限滚动（数据源协议 · 模拟服务端分页 2000 条）</div>
    <div id="infiniteHost" style="height: 320px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);"></div>
    <div id="log"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
