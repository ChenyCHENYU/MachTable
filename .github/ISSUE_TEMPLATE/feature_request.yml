name: Feature request
description: Propose a focused capability or API improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the business need, not only the desired API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Best-fit scope
      options: [Core, Vue adapter, React adapter, Optional feature package, Documentation]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and bundle-size considerations
      description: Explain workarounds and whether this belongs outside Core.
