name: Bug report
description: Report a reproducible MachTable defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve MachTable. Do not include credentials or customer data.
  - type: input
    id: version
    attributes:
      label: Package versions
      description: Core and Vue/React adapter versions.
      placeholder: "@agile-team/mach-table 0.4.0"
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options: [Vue 3, React, Vanilla, Nuxt, Next.js, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link or paste the smallest safe example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and errors
      description: Include gridError source/context and browser console output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 140 / Windows 11"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials and customer data.
          required: true
