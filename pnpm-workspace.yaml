packages:
  - "packages/*"
  - "examples/*"

# Embed package docs into registry metadata so npmjs.com renders them.
embedReadme: true

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - knip@6.33.0
  - undici@8.10.2
  - fast-uri@3.1.8
  - brace-expansion@5.0.12

overrides:
  esbuild: 0.27.2
  vite: 6.4.3
