packages:
  - "packages/*"
  - "examples/*"

# Embed package docs into registry metadata so npmjs.com renders them.
embedReadme: true

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - knip@6.33.0
  - undici@8.10.2
  - fast-uri@3.1.8
  - brace-expansion@5.0.12

overrides:
  esbuild: 0.27.2
  vite: 6.4.4
  vue: 3.5.42
  launch-editor: 2.14.2
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  undici: 8.12.2
  zod: 4.6.6
